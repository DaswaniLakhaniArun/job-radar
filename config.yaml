# job-radar configuration
# Everything here is public. Personal data (email, API keys) lives in GitHub Secrets.

# How far back to look for new postings, in hours (one week).
hours_old: 168

# Maximum number of offers in the weekly email.
max_results: 30

# Minimum score an offer needs to appear in the email.
min_score: 4

# Searches run on LinkedIn and Indeed (through JobSpy).
searches:
  # Kept short on purpose: LinkedIn rate-limits (HTTP 429) after ~40 searches in a row.
  terms:
    - devops intern
    - cloud intern
    - devops junior
    - cloud engineer junior
    - sre junior

  # Each location is searched with every term.
  # indeed_country uses JobSpy's country names; leave it out to skip Indeed.
  locations:
    - name: Spain (remote)
      query: Spain
      remote: true
      indeed_country: spain
    - name: Madrid
      query: Madrid, Spain
      indeed_country: spain
    - name: Barcelona
      query: Barcelona, Spain
      indeed_country: spain
    - name: London
      query: London, United Kingdom
      indeed_country: uk
    - name: Zurich
      query: Zurich, Switzerland
      indeed_country: switzerland
    - name: Dubai
      query: Dubai, United Arab Emirates
      indeed_country: united arab emirates
    - name: United States (remote)
      query: United States
      remote: true
      indeed_country: usa

  sites: [linkedin, indeed]
  results_per_search: 20
  # Fetching LinkedIn descriptions improves scoring but makes many more requests.
  linkedin_descriptions: false

# Spanish-language searches (only for Spanish locations).
spanish_terms:
  - prácticas cloud
  - prácticas devops

# Remotive (remote jobs API, no key needed).
remotive:
  enabled: true
  categories: [devops, software-dev]

# Adzuna (paid API since 2026: £8/month; needs ADZUNA_APP_ID and ADZUNA_APP_KEY secrets).
adzuna:
  enabled: false
  countries: [es, gb, ch, us]
  terms: [devops junior, cloud engineer junior, devops intern]

# Extra information for the offers that make it into the email.
enrich:
  linkedin_descriptions: true   # fetch the description of LinkedIn finalists (few requests)
  max_descriptions: 40

# Summaries and assessment with Gemini (free tier). Needs the GEMINI_API_KEY secret.
ai:
  enabled: true
  # Tried in order; the "-latest" aliases follow Google's current models.
  models: [gemini-flash-lite-latest, gemini-flash-latest]
  batch_size: 5
  pause_seconds: 5
  profile: >-
    Ingeniero informático recién graduado (2026), desarrollador de software en una empresa SaaS,
    estudiando un máster en Cloud & DevOps. Busca prácticas o primer empleo en cloud, DevOps, SRE o
    plataforma. Experiencia con CI/CD (Bitbucket Pipelines), publicación de apps, Git y gestión de
    secretos; formándose en AWS, Azure, Docker, Kubernetes y Terraform. Lenguajes fuertes: SQL, C y C++.
    No quiere puestos full-stack ni frontend. Idiomas: español nativo, inglés B2, italiano B1.

# Private GitHub Projects board (needs the PROJECT_TOKEN secret).
board:
  enabled: true
  title: job-radar
  reapply_after_days: 90       # a rejected offer can come back after this many days if it is republished
  follow_up_after_days: 14     # remind to follow up an application with no changes
  stale_after_days: 21         # "Me interesa" offers not seen again for this long may be closed
  archive_new_after_days: 21   # "Nueva" cards left untouched are archived

# Approximate ranges shown only when the offer doesn't publish a salary (gross).
# Orientative figures for 2026, to be refined; they are always labelled "estimado" in the email.
salary_estimates:
  regions:
    - name: Madrid/Barcelona
      match: [madrid, barcelona]
      internship: 800–1.200 €/mes
      junior: 26.000–34.000 €/año
    - name: España
      match: [spain, españa, valencia, sevilla, malaga, bilbao, tenerife, canarias, gran canaria]
      internship: 600–1.000 €/mes
      junior: 24.000–30.000 €/año
    - name: Reino Unido
      match: [london, united kingdom, uk, england, scotland, manchester]
      internship: £2.000–2.600/mes
      junior: £35.000–45.000/año
    - name: Suiza
      match: [zurich, zürich, geneva, genève, basel, lausanne, switzerland]
      internship: CHF 2.500–4.000/mes
      junior: CHF 85.000–100.000/año
    - name: Emiratos
      match: [dubai, abu dhabi, united arab emirates, uae]
      internship: AED 3.000–6.000/mes
      junior: AED 10.000–15.000/mes (sin impuesto sobre la renta)
    - name: EE. UU.
      match: [usa, united states, new york, san francisco, seattle, austin, boston]
      internship: $4.500–8.000/mes
      junior: $80.000–110.000/año
    - name: Europa (remoto)
      match: [europe, emea, eu]
      internship: 1.000–1.800 €/mes
      junior: 30.000–45.000 €/año

# Scoring rules (all matching is case-insensitive).
scoring:
  # The title must contain at least one of these to be considered.
  role_keywords:
    - devops
    - dev ops
    - cloud
    - sre
    - site reliability
    - platform engineer
    - infrastructure
    - infraestructura
    - kubernetes
    - aws
    - azure
    - gcp
    - sysadmin
    - systems engineer
    - ci/cd
    - release engineer
    - build engineer

  # Offers with these in the title are dropped.
  exclude_title:
    - senior
    - sr.
    - sr
    - lead
    - principal
    - staff
    - manager
    - head of
    - director
    - architect
    - arquitecto
    - full stack
    - fullstack
    - full-stack
    - frontend
    - front-end
    - react
    - sales
    - account executive
    - recruiter

  internship_keywords:
    - intern
    - internship
    - prácticas
    - practicas
    - becario
    - becaria
    - trainee
    - stage
    - werkstudent

  junior_keywords:
    - junior
    - jr
    - graduate
    - entry level
    - entry-level
    - early career
    - new grad
    - associate

  # Skills that add points when they appear in the title or description.
  skills:
    - aws
    - azure
    - gcp
    - docker
    - kubernetes
    - terraform
    - ansible
    - jenkins
    - github actions
    - gitlab
    - bitbucket
    - ci/cd
    - linux
    - bash
    - python
    - prometheus
    - grafana
    - helm
    - argocd
    - infisical
    - vault

  # Skills already on Arun's CV; the email lists the job's skills that are not here.
  cv_skills:
    - aws
    - azure
    - docker
    - kubernetes
    - terraform
    - ansible
    - jenkins
    - ci/cd
    - bitbucket
    - git
    - python
    - sql
    - prometheus
    - grafana
    - infisical
    - android

  # Required languages Arun doesn't speak lower the score.
  language_penalties:
    - german
    - deutsch
    - french
    - français
    - arabic
    - dutch
    - polish

  # Years of experience above this lower the score.
  max_years_experience: 2
