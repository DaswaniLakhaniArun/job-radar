name: Tests

on:
  push:
    branches: [main]
    paths: ["job_radar/**", "tests/**", "config.yaml", "requirements*.txt"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install PyYAML requests pytest
      - run: python -m pytest -q
